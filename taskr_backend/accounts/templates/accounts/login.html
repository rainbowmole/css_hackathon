<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSync AI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<div class="app-shell">
  <nav class="topbar" aria-label="Primary navigation">
    <button class="topbar-logo" id="home-btn" aria-label="Back to home">SkillSync AI</button>
  </nav>

  <main class="main">
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to your SkillSync AI account</p>
        
        <form id="login-form" class="auth-form">
          {% csrf_token %}
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com">
            <span class="error-message" id="email-error"></span>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
            <span class="error-message" id="password-error"></span>
          </div>
          
          <span class="error-message" id="form-error"></span>
          
          <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
        
        <div class="auth-footer">
          <p>Don't have an account? <a href="/register/">Sign up</a></p>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // Set admin home button
  document.getElementById('home-btn').addEventListener('click', () => {
    window.location.href = '/';
  });

  // Handle login form submission
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const formError = document.getElementById('form-error');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    
    formError.textContent = '';
    
    try {
      const response = await fetch('/api/auth/login/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken,
        },
        body: JSON.stringify({ email, password }),
      });
      
      const data = await response.json();
      
      if (data.success) {
        // Redirect based on role
        if (data.user && (data.user.role === 'freelancer' || data.user.current_active_role === 'freelancer')) {
          window.location.href = '/freelancer.html';
        } else {
          window.location.href = '/customer.html';
        }
      } else {
        formError.textContent = data.error || data.errors?.__all__?.[0] || 'Login failed';
      }
    } catch (error) {
      formError.textContent = 'An error occurred. Please try again.';
    }
  });
</script>
</body>
</html>
